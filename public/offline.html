<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão · Pague pelo App</title>
    <style>
      :root { --fundo: #f8fafc; --texto: #0f172a; --texto-2: #64748b; --marca: #0f766e; --marca-texto: #fff; }
      @media (prefers-color-scheme: dark) {
        :root { --fundo: #0b1220; --texto: #f1f5f9; --texto-2: #94a3b8; --marca: #2dd4bf; --marca-texto: #0b1220; }
      }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fundo); color: var(--texto);
             font-family: Inter, ui-sans-serif, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: var(--texto-2); margin: 0 0 24px; line-height: 1.5; }
      button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: var(--marca); color: var(--marca-texto);
               font-size: 16px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" width="64" height="64" alt="" />
      <h1>Você está sem internet</h1>
      <p>Sua comanda continua salva. Assim que a conexão voltar,<br />é só tentar de novo.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
